# Sparta Motors — nginx reverse proxy in front of the Next.js/Payload app.
#
# Install on the server as /etc/nginx/sites-available/sparta-motors, then:
#   sudo ln -s /etc/nginx/sites-available/sparta-motors /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace every REPLACE_DOMAIN with the real domain before use.

# --- Real visitor IP recovery -------------------------------------------------
#
# Every request arrives from Cloudflare, so without this block $remote_addr is a
# Cloudflare edge IP, not the visitor. Two things break as a result:
#
#   1. The limit_req zone below buckets by $binary_remote_addr, so ALL visitors
#      coming through one edge node share a single 5r/s bucket. A busy afternoon
#      could 503 a real customer's form submission — a lost lead.
#   2. Nothing establishes CF-Connecting-IP as trustworthy, so the app-level
#      limiter (src/lib/rate-limit.ts, which reads that header first) has no
#      guarantee it wasn't set by the client.
#
# `real_ip_header CF-Connecting-IP` only takes effect for requests whose source
# is one of the set_real_ip_from ranges, so a direct-to-origin connection cannot
# forge it.
#
# Ranges from https://www.cloudflare.com/ips — they change rarely, but re-check
# them if visitor IPs ever start showing up as Cloudflare addresses again.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Rate-limit zone for public form posts. 5 requests/second per IP with a small
# burst — generous for a human, useless for a spam script. The app also enforces
# its own limit (5 submits / 10 min / IP, src/lib/rate-limit.ts); this is the
# cheap first line that never reaches Node.
limit_req_zone $binary_remote_addr zone=sparta_forms:10m rate=5r/s;

# HTTP → HTTPS, and bare-domain canonicalisation.
server {
    listen 80;
    listen [::]:80;
    server_name REPLACE_DOMAIN www.REPLACE_DOMAIN;
    return 301 https://REPLACE_DOMAIN$request_uri;
}

# www → apex over HTTPS.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.REPLACE_DOMAIN;

    ssl_certificate     /etc/ssl/sparta/origin.pem;
    ssl_certificate_key /etc/ssl/sparta/origin.key;

    return 301 https://REPLACE_DOMAIN$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name REPLACE_DOMAIN;

    ssl_certificate     /etc/ssl/sparta/origin.pem;
    ssl_certificate_key /etc/ssl/sparta/origin.key;

    # Photo and video uploads from the admin. Payload itself caps a single file
    # at 64MB (payload.config.ts upload.limits) — this must be at least that or
    # nginx rejects the upload before Payload can return a friendly error.
    client_max_body_size 80M;

    # Truck photos come off phones; give slow uploads room to finish.
    client_body_timeout 120s;
    proxy_read_timeout 120s;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Uploaded media. Payload serves these at /api/media/file/<filename>, but the
    # files sit on disk — nginx can hand them out without waking Node. try_files
    # falls back to the app for anything not on disk (e.g. a resized variant that
    # Payload generates on request).
    location /api/media/file/ {
        alias /var/www/sparta-motors/media/;
        try_files $uri @app;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        # These files are served straight off disk, so they never pass through
        # Next.js and miss the headers() block in next.config.ts. nosniff is the
        # one that matters for staff-uploaded content: it stops a browser
        # second-guessing the declared type of a file someone uploaded.
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    # Public form endpoints — rate limited. burst=10 absorbs a legitimate
    # double-click; nodelay means honest traffic isn't slowed, only excess is
    # rejected with 503.
    #
    # client_max_body_size is overridden down from the 80M set above: that limit
    # exists for admin photo uploads, and leaving it in force here would let an
    # anonymous POST push an 80MB body into the leads table.
    location = /api/leads {
        limit_req zone=sparta_forms burst=10 nodelay;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    location = /api/fleet-inquiries {
        limit_req zone=sparta_forms burst=10 nodelay;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    location @app {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }
}
